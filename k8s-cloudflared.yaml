apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-mydecks
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-mydecks
  template:
    metadata:
      labels:
        app: cloudflared-mydecks
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-token
              key: token
